<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince Kumar - Cloud Stealth Interview Assistant</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
        input, select, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #30363d; font-size: 14px; }
        input { background: #0d1117; color: #fff; width: 65%; }
        button { background: #238636; color: #fff; border: none; cursor: pointer; font-weight: 600; }
        button.stop { background: #da3633; }
        button.secondary { background: #1f6feb; }
        .status { display: inline-block; padding: 5px 12px; border-radius: 12px; font-size: 12px; background: #21262d; }
        .log-box { background: #010409; padding: 14px; border-radius: 8px; height: 280px; overflow-y: auto; font-size: 14px; line-height: 1.6; border: 1px solid #30363d; margin-top: 10px; }
        .interviewer { color: #ff7b72; }
        .candidate { color: #79c0ff; }
        .ai-reply { color: #7ee787; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <h2>Cloud Stealth Interview Assistant</h2>
    
    <div class="card">
        <label><strong>1. Meeting Invitation Link (Zoom / Google Meet / Teams):</strong></label><br><br>
        <input type="text" id="meetingLink" placeholder="https://meet.google.com/xxx-xxxx-xxx">
        <button class="secondary" onclick="openMeeting()">Open Meeting</button>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div>
                <button id="startBtn" onclick="startHandsFree()">Start Hands-Free AI</button>
                <button class="stop" onclick="stopHandsFree()">Stop</button>
                <select id="listenMode" style="background:#0d1117; color:#fff; margin-left:8px;">
                    <option value="INTERVIEWER">Auto-Answer Interviewer</option>
                    <option value="CANDIDATE_FIX">Fix My Broken English / Hinglish</option>
                </select>
            </div>
            <span class="status" id="connStatus">Disconnected</span>
        </div>
    </div>

    <div class="card">
        <strong>2. Live Transcript & Instant AI Output:</strong>
        <div class="log-box" id="logBox"></div>
    </div>
</div>

<script>
    let ws;
    let recognition;
    let isRunning = false;
    let isSpeaking = false;

    function log(msg, cls = "") {
        const box = document.getElementById("logBox");
        box.innerHTML += `<div class="${cls}">${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function openMeeting() {
        let url = document.getElementById("meetingLink").value.trim();
        if (!url) return alert("Please paste a valid meeting link first!");
        if (url.includes("zoom.us/j/") && !url.includes("/wc/")) {
            url = url.replace("/j/", "/wc/join/");
        }
        window.open(url, "_blank", "width=1100,height=750");
        log("Meeting opened in new tab. Click 'Start Hands-Free AI' to begin.", "candidate");
    }

    function connectWS() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/interview`);
        
        ws.onopen = () => {
            document.getElementById("connStatus").innerText = "Connected (8 AI Models Ready)";
            document.getElementById("connStatus").style.color = "#7ee787";
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            log(`[AI - ${data.model} (${data.latency}s)]: ${data.reply}`, "ai-reply");
            speakBrowserVoice(data.reply);
        };

        ws.onclose = () => {
            document.getElementById("connStatus").innerText = "Reconnecting...";
            document.getElementById("connStatus").style.color = "#ff7b72";
            if (isRunning) setTimeout(connectWS, 2000);
        };
    }

    function speakBrowserVoice(text) {
        isSpeaking = true;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-IN";
        utter.rate = 1.02;
        utter.onend = () => { setTimeout(() => { isSpeaking = false; }, 400); };
        window.speechSynthesis.speak(utter);
    }

    function startHandsFree() {
        if (isRunning) return;
        isRunning = true;
        connectWS();

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Please open this page in Google Chrome or Microsoft Edge.");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "en-IN";
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            if (isSpeaking) return;
            const last = event.results.length - 1;
            const transcript = event.results[last][0].transcript.trim();
            const mode = document.getElementById("listenMode").value;

            if (transcript.length > 3 && ws && ws.readyState === WebSocket.OPEN) {
                log(`[${mode}]: ${transcript}`, mode === "INTERVIEWER" ? "interviewer" : "candidate");
                ws.send(JSON.stringify({ text: transcript, mode: mode }));
            }
        };

        recognition.onend = () => {
            if (isRunning) recognition.start();
        };

        recognition.start();
        log("Hands-Free Listener Active!", "ai-reply");
    }

    function stopHandsFree() {
        isRunning = false;
        if (recognition) recognition.stop();
        if (ws) ws.close();
        document.getElementById("connStatus").innerText = "Stopped";
    }
</script>
</body>
</html>
